name: Full CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmx-full-ci
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  full-suite:
    name: Full suite (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install pinned Zig
        run: ./scripts/ci-install-zig.sh

      - name: Install from source
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export BUN_INSTALL="$RUNNER_TEMP/bun"
          export FMX_INSTALL_BIN_DIR="$RUNNER_TEMP/bin"
          mkdir -p "$HOME" "$BUN_INSTALL/bin" "$FMX_INSTALL_BIN_DIR"
          export PATH="$BUN_INSTALL/bin:$FMX_INSTALL_BIN_DIR:$PATH"
          ./scripts/install.sh --install

      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export BUN_INSTALL="$RUNNER_TEMP/bun"
          export FMX_INSTALL_BIN_DIR="$RUNNER_TEMP/bin"
          export PATH="$BUN_INSTALL/bin:$FMX_INSTALL_BIN_DIR:$PATH"
          bun run typecheck
          bun test
          fmx doctor
          FMX_BINARY_PATH="$BUN_INSTALL/bin/fmx" \
          FMX_ZMX_PATH="$FMX_INSTALL_BIN_DIR/fmx-zmx" \
          FMX_RUN_PTY_TESTS=1 \
            bun test tests/multiplexer.e2e.test.ts

      - name: Verify native architectures
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux-x86_64) pattern='ELF 64-bit.*x86-64' ;;
            linux-aarch64) pattern='ELF 64-bit.*(ARM aarch64|aarch64)' ;;
            macos-x86_64) pattern='Mach-O 64-bit executable x86_64' ;;
            macos-aarch64) pattern='Mach-O 64-bit executable arm64' ;;
          esac
          file "$RUNNER_TEMP/bin/fmx-fx" | grep -Eq "$pattern"
          file "$RUNNER_TEMP/bin/fmx-zmx" | grep -Eq "$pattern"
