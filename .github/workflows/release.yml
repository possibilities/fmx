name: Release native binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.release.outputs.configured }}
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      fx_commit: ${{ steps.release.outputs.fx_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RELEASE_BASE_URL: ${{ vars.FMX_RELEASE_BASE_URL }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version is not SemVer: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          fx_commit="$(jq -r '.commit' fx.json)"
          fxnk_version="$(jq -r '.fxnk' fx.json)"
          if [[ ! "$fx_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::fx.json commit is not a full SHA"
            exit 1
          fi
          if [[ ! "$fxnk_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::fx.json fxnk is not SemVer"
            exit 1
          fi
          echo "fx_commit=$fx_commit" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

          if [[ -z "$BLOB_READ_WRITE_TOKEN" || -z "$RELEASE_BASE_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set the BLOB_READ_WRITE_TOKEN secret and FMX_RELEASE_BASE_URL repository variable, then run this workflow manually."
            exit 0
          fi
          if [[ "$RELEASE_BASE_URL" == */ ]]; then
            echo "::error::FMX_RELEASE_BASE_URL must not have a trailing slash"
            exit 1
          fi
          if [[ ! "$RELEASE_BASE_URL" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*\.public\.blob\.vercel-storage\.com(/[A-Za-z0-9._/-]+)?$ ]]; then
            echo "::error::FMX_RELEASE_BASE_URL must be a public Vercel Blob URL"
            exit 1
          fi
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              for suffix in "" .sha256; do
                curl --fail --silent --show-error --location \
                  "$RELEASE_BASE_URL/fx/releases/$fx_commit/fmx-fx-$platform.$extension$suffix" \
                  -o /dev/null
              done
            done
          done
          curl --fail --silent --show-error --location "$RELEASE_BASE_URL/fx/setup.sh" -o /dev/null
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          probe_archive="fmx-fx-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            "$RELEASE_BASE_URL/fx/releases/$fx_commit/$probe_archive" -o "$probe_dir/$probe_archive"
          curl --fail --silent --show-error --location \
            "$RELEASE_BASE_URL/fx/releases/$fx_commit/$probe_archive.sha256" -o "$probe_dir/$probe_archive.sha256"
          (cd "$probe_dir" && sha256sum --check "$probe_archive.sha256")
          tar -xzf "$probe_dir/$probe_archive" -C "$probe_dir"
          probe="$("$probe_dir/fmx-fx" --fxnk-version)"
          probe_pattern='^fxnk ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?) \(fx [^)]+\)$'
          if [[ ! "$probe" =~ $probe_pattern ]]; then
            echo "::error::pinned fmx-fx returned an invalid --fxnk-version probe"
            exit 1
          fi
          python3 - "${BASH_REMATCH[1]}" "$fxnk_version" <<'PY'
          import re
          import sys

          def semver(value):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?", value)
              if match is None:
                  raise SystemExit(f"invalid SemVer: {value}")
              return tuple(map(int, match.group(1, 2, 3))), match.group(4)

          def compare_prerelease(left, right):
              if left == right:
                  return 0
              if left is None:
                  return 1
              if right is None:
                  return -1
              for a, b in zip(left.split("."), right.split(".")):
                  if a == b:
                      continue
                  if a.isdigit() and b.isdigit():
                      return (int(a) > int(b)) - (int(a) < int(b))
                  if a.isdigit() != b.isdigit():
                      return -1 if a.isdigit() else 1
                  return (a > b) - (a < b)
              return (len(left.split(".")) > len(right.split("."))) - (len(left.split(".")) < len(right.split(".")))

          actual, required = map(semver, sys.argv[1:])
          compatible = actual[0] > required[0] or (actual[0] == required[0] and compare_prerelease(actual[1], required[1]) >= 0)
          if not compatible:
              raise SystemExit(f"pinned fmx-fx reports fxnk {sys.argv[1]}; fmx requires {sys.argv[2]} or newer")
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true' && needs.check-version.outputs.configured == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install xz
        run: |
          if command -v xz >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          else
            brew install xz
          fi

      - name: Install Zig for the Companion
        run: ./scripts/ci-install-zig.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test source
        run: |
          bun run typecheck
          bun test

      - name: Compile, minimize, and package
        run: ./scripts/build-release.sh "${{ matrix.platform }}"

      - name: Test compiled pair in a PTY
        env:
          FMX_BINARY_PATH: dist/fmx
          FMX_ZMX_PATH: dist/fmx-zmx
          FMX_RUN_PTY_TESTS: "1"
        run: bun test tests/multiplexer.e2e.test.ts

      - name: Upload verified archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fmx-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/release/fmx-${{ matrix.platform }}.tar.xz
            dist/release/fmx-${{ matrix.platform }}.tar.xz.sha256
            dist/release/fmx-${{ matrix.platform }}.tar.gz
            dist/release/fmx-${{ matrix.platform }}.tar.gz.sha256

  publish:
    needs: [check-version, build]
    name: Publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RELEASE_BASE_URL: ${{ vars.FMX_RELEASE_BASE_URL }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fmx-*
          path: dist/release
          merge-multiple: true

      - name: Verify complete release set
        run: |
          set -euo pipefail
          cd dist/release
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              archive="fmx-$platform.$extension"
              test -f "$archive"
              test -f "$archive.sha256"
              sha256sum --check "$archive.sha256"
            done
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 16

      - name: Publish immutable artifacts and installer
        id: blob
        run: |
          set -euo pipefail
          base_without_scheme="${RELEASE_BASE_URL#https://}"
          case "$base_without_scheme" in
            */*) blob_prefix="${base_without_scheme#*/}" ;;
            *) blob_prefix="" ;;
          esac

          blob_path() {
            local relative_path="$1"
            if [[ -n "$blob_prefix" ]]; then
              printf '%s/%s' "$blob_prefix" "$relative_path"
            else
              printf '%s' "$relative_path"
            fi
          }

          upload_immutable() {
            local local_path="$1"
            local relative_path="$2"
            local content_type="$3"
            local remote_url="$RELEASE_BASE_URL/$relative_path"
            local existing response http_code
            existing="$(mktemp)"
            response="$(mktemp)"
            if curl --fail --silent --location "$remote_url" -o "$existing"; then
              if cmp -s "$local_path" "$existing"; then
                echo "Already published: $relative_path"
                rm -f "$existing" "$response"
                return 0
              fi
              echo "::error::Immutable Blob path has different content: $relative_path"
              rm -f "$existing" "$response"
              return 1
            fi
            rm -f "$existing"
            http_code="$(curl --silent --show-error -o "$response" -w '%{http_code}' \
              -X PUT "https://blob.vercel-storage.com/$(blob_path "$relative_path")" \
              -H "Authorization: Bearer $BLOB_READ_WRITE_TOKEN" \
              -H 'x-api-version: 7' \
              -H "x-content-type: $content_type" \
              -H 'x-add-random-suffix: 0' \
              -H 'x-cache-control-max-age: 31536000' \
              --data-binary "@$local_path")"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              cat "$response" >&2
              rm -f "$response"
              echo "::error::Blob upload failed for $relative_path ($http_code)"
              return 1
            fi
            rm -f "$response"
            echo "Published: $relative_path"
          }

          upload_mutable() {
            local local_path="$1"
            local relative_path="$2"
            local content_type="$3"
            local max_age="$4"
            local response http_code
            response="$(mktemp)"
            http_code="$(curl --silent --show-error -o "$response" -w '%{http_code}' \
              -X PUT "https://blob.vercel-storage.com/$(blob_path "$relative_path")" \
              -H "Authorization: Bearer $BLOB_READ_WRITE_TOKEN" \
              -H 'x-api-version: 7' \
              -H "x-content-type: $content_type" \
              -H 'x-add-random-suffix: 0' \
              -H 'x-allow-overwrite: 1' \
              -H "x-cache-control-max-age: $max_age" \
              --data-binary "@$local_path")"
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              cat "$response" >&2
              rm -f "$response"
              echo "::error::Blob upload failed for $relative_path ($http_code)"
              return 1
            fi
            rm -f "$response"
            echo "Published: $relative_path"
          }

          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            for extension in tar.xz tar.gz; do
              archive="fmx-$platform.$extension"
              content_type="application/gzip"
              [[ "$extension" == "tar.xz" ]] && content_type="application/x-xz"
              upload_immutable "dist/release/$archive" "releases/v$VERSION/$archive" "$content_type"
              upload_immutable "dist/release/$archive.sha256" "releases/v$VERSION/$archive.sha256" "text/plain"
            done
          done

          sed \
            -e "s|__FMX_RELEASE_BASE_URL__|$RELEASE_BASE_URL|g" \
            -e "s|__FMX_FX_SETUP_URL__|$RELEASE_BASE_URL/fx/setup.sh|g" \
            setup.sh > dist/setup.sh
          bash -n dist/setup.sh
          upload_mutable dist/setup.sh setup.sh text/x-shellscript 300

          printf 'v%s' "$VERSION" > dist/latest.txt
          upload_mutable dist/latest.txt latest.txt text/plain 60
          echo "setup_url=$RELEASE_BASE_URL/setup.sh" >> "$GITHUB_OUTPUT"

      - name: Tag released commit
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Write release summary
        env:
          SETUP_URL: ${{ steps.blob.outputs.setup_url }}
        run: |
          printf '## fmx %s\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf "Install with \`%s\`.\n" "curl -fsSL $SETUP_URL | bash" >> "$GITHUB_STEP_SUMMARY"
